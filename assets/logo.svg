<svg width="256" height="256" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="xrmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="xrmBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Laser Beams (The "X") Gradient -->
    <linearGradient id="xrmGradBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Cyber Glow Filter -->
    <filter id="xrmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#020617" opacity="0.6" />

  <!-- Outer Rounded Squircle Container -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#xrmBg)" stroke="url(#xrmBorder)" stroke-width="2.5" stroke-opacity="0.8" />

  <!-- Diagonal Mesh Hex Guides -->
  <path d="M24 50 L50 24 M76 50 L50 76 M50 24 L76 50 M50 76 L24 50" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="2 3" />

  <!-- Secondary Inner Overlay Connectors (Mesh Network Topology) -->
  <path d="M26 26 L50 15 L74 26 L85 50 L74 74 L50 85 L26 74 L15 50 Z" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="3 3" fill="none" />

  <!-- X-Ray Laser Cross Beams (The "X") -->
  <line x1="26" y1="26" x2="74" y2="74" stroke="url(#xrmGradBeam)" stroke-width="5" stroke-linecap="round" filter="url(#xrmGlow)" />
  <line x1="26" y1="74" x2="74" y2="26" stroke="url(#xrmGradBeam)" stroke-width="5" stroke-linecap="round" filter="url(#xrmGlow)" />

  <!-- Outer Constellation Mesh Nodes (Peers) -->
  <!-- Top-Left Node -->
  <circle cx="26" cy="26" r="5" fill="#0f172a" stroke="#0ea5e9" stroke-width="2.5" />
  <circle cx="26" cy="26" r="2.2" fill="#38bdf8" />

  <!-- Top-Right Node -->
  <circle cx="74" cy="26" r="5" fill="#0f172a" stroke="#6366f1" stroke-width="2.5" />
  <circle cx="74" cy="26" r="2.2" fill="#818cf8" />

  <!-- Bottom-Left Node -->
  <circle cx="26" cy="74" r="5" fill="#0f172a" stroke="#10b981" stroke-width="2.5" />
  <circle cx="26" cy="74" r="2.2" fill="#34d399" />

  <!-- Bottom-Right Node -->
  <circle cx="74" cy="74" r="5" fill="#0f172a" stroke="#0ea5e9" stroke-width="2.5" />
  <circle cx="74" cy="74" r="2.2" fill="#38bdf8" />

  <!-- Perimeter Satellite Nodes -->
  <circle cx="50" cy="15" r="2.5" fill="#38bdf8" fill-opacity="0.8" />
  <circle cx="85" cy="50" r="2.5" fill="#38bdf8" fill-opacity="0.8" />
  <circle cx="50" cy="85" r="2.5" fill="#38bdf8" fill-opacity="0.8" />
  <circle cx="15" cy="50" r="2.5" fill="#38bdf8" fill-opacity="0.8" />

  <!-- Central Core Pulse Hub (Intersection of X & Mesh Center) -->
  <circle cx="50" cy="50" r="10" fill="#0ea5e9" fill-opacity="0.2" />
  <circle cx="50" cy="50" r="6.5" fill="#0f172a" stroke="url(#xrmGradBeam)" stroke-width="2" />
  <circle cx="50" cy="50" r="3.5" fill="#38bdf8" />
</svg>
