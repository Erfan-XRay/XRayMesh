name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n xraymesh.sh

      - name: Run ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck xraymesh.sh

      - name: Verify executable bit and LF endings
        run: |
          test -x xraymesh.sh
          ! grep -Il $'\r' xraymesh.sh README.md README_FA.md LICENSE

      - name: Test embedded HAProxy port parser
        run: bash tests/port_parser_test.sh
