<svg width="256" height="256" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="XRayMesh">
  <!-- The XRayMesh mark (same as the web panel and home-screen icon): an X of two links joining four peers through a central hub. -->
  <defs>
    <linearGradient id="xrmTile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a2029" />
      <stop offset="1" stop-color="#0b0e13" />
    </linearGradient>
    <linearGradient id="xrmLink" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.55" />
    </linearGradient>
    <radialGradient id="xrmHalo" cx="32" cy="32" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22" />
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="17" fill="url(#xrmTile)" stroke="#37414f" stroke-width="1.5" />
  <circle cx="32" cy="32" r="26" fill="url(#xrmHalo)" />
  <path d="M20 20 44 44M44 20 20 44" stroke="url(#xrmLink)" stroke-width="5" stroke-linecap="round" />
  <circle cx="20" cy="20" r="5" fill="#2dd4bf" />
  <circle cx="44" cy="20" r="5" fill="#2dd4bf" fill-opacity="0.75" />
  <circle cx="20" cy="44" r="5" fill="#2dd4bf" fill-opacity="0.75" />
  <circle cx="44" cy="44" r="5" fill="#2dd4bf" />
  <circle cx="32" cy="32" r="6.5" fill="#1a2029" stroke="#2dd4bf" stroke-width="3" />
</svg>
