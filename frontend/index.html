<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark" data-palette="firouzeh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Release marker checked by the self-updater before installing this file. -->
  <meta name="xraymesh-version" content="%XRAYMESH_VERSION%" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b0e13" />
  <title>XRayMesh</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23141920'/%3E%3Cpath d='M20 20 44 44M44 20 20 44' stroke='%232dd4bf' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='20' r='5' fill='%232dd4bf'/%3E%3Ccircle cx='44' cy='20' r='5' fill='%232dd4bf'/%3E%3Ccircle cx='20' cy='44' r='5' fill='%232dd4bf'/%3E%3Ccircle cx='44' cy='44' r='5' fill='%232dd4bf'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23141920' stroke='%232dd4bf' stroke-width='3'/%3E%3C/svg%3E" />
  <!-- Apply saved language, mode and palette before first paint so the page never flashes. -->
  <script>
    (function () {
      var root = document.documentElement;
      function read(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      }
      var legacy = { sky: 'ocean', emerald: 'firouzeh', violet: 'iris', amber: 'saffron', rose: 'firouzeh', oled: 'midnight' };
      var palettes = ['firouzeh', 'ocean', 'iris', 'saffron', 'graphite', 'midnight'];
      var palette = read('xraymesh_theme_palette');
      palette = legacy[palette] || palette;
      if (palettes.indexOf(palette) < 0) palette = 'firouzeh';
      var mode = read('xraymesh_theme_mode');
      var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var lang = read('xraymesh_dashboard_lang') === 'fa' ? 'fa' : 'en';
      root.setAttribute('data-palette', palette);
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      root.lang = lang;
      root.dir = lang === 'fa' ? 'rtl' : 'ltr';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
